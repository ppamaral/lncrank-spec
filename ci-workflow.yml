name: lncRank-Spec CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest httpx

    - name: Python Syntax and Compilation Check
      run: |
        python -m py_compile multi_agent_prescreening.py
        python -m py_compile prescreening-dashboard.py
        python -m py_compile fastapi_multiagent_api.py

    - name: Run Core Multi-Agent Pipeline Script
      run: |
        python multi_agent_prescreening.py

    - name: Test FastAPI Microservice Endpoints
      run: |
        pytest -v -k "not integration" || python -c "
        import fastapi_multiagent_api
        print('FastAPI App loaded successfully and routes compiled!')
        "
